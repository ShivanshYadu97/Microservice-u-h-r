<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Naukri Job Card Blocker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="header">
        <h1>Naukri Job Card Blocker</h1>
      </header>

      <section class="content">
        <div class="add-row">
          <input id="blockText" type="text" placeholder="Skill, company, keyword..." autocomplete="off" />
          <button id="addButton" type="button">Add</button>
        </div>

        <div class="toolbar">
          <label class="switch">
            <input id="enabled" type="checkbox" />
            <span>Active</span>
          </label>
          <button id="rescanButton" type="button">Rescan</button>
          <button id="clearButton" type="button">Clear</button>
        </div>

        <div id="emptyState" class="empty">Add `python` to hide Python jobs.</div>
        <ul id="blockList" class="block-list" aria-label="Blocked keywords"></ul>

        <footer id="status" class="status">Open a Naukri search page and add keywords.</footer>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
