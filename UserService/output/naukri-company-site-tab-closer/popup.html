<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Naukri Company Site Tab Closer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header>
        <h1>Naukri Company Site Tab Closer</h1>
      </header>

      <section class="content">
        <label class="toggle-row">
          <input id="enabled" type="checkbox" />
          <span>Auto-close tabs showing company-site apply</span>
        </label>

        <label class="field">
          <span>Close delay</span>
          <select id="delay">
            <option value="0">Instant</option>
            <option value="700">0.7 second</option>
            <option value="1500">1.5 seconds</option>
            <option value="3000">3 seconds</option>
          </select>
        </label>

        <button id="scanButton" type="button">Scan current tab</button>

        <div class="phrases">
          <strong>Closes on:</strong>
          <span>Apply on company site</span>
          <span>Apply to company site</span>
          <span>Apply on external site</span>
        </div>

        <footer id="status">Ready on Naukri tabs.</footer>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
